<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .text-content {
            flex: 1;
            text-align: left;
        }
        .image {
            flex: 1;
            text-align: right;
        }
        .image img {
            width: 150px;
            height: auto;
            border-radius: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-content">
            <h1>Start Attendance</h1>
            <p>Click below to begin the attendance process.</p>
            <form action="/start_attendance" method="post">
                <button type="submit">Take Attendance</button>
            </form>
        </div>
        <div class="image">
            <img src="/static/images/roll-call.png" alt="Start Attendance">
        </div>
    </div>

    <div class="container">
        <div class="text-content">
            <h1>View Attendance</h1>
            <p>Click below to view attendance.</p>
            <form action="/attendance_results" method="post">
                <button type="submit">View Attendance</button>
            </form>
        </div>
        <div class="image">
            <img src="/static/images/assign.png" alt="View Attendance">
        </div>
    </div>

</body>
</html>
