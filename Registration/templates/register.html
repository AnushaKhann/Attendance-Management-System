<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facial Recognition Registration</title>
    <style>
        * {
            
            padding: 10px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        /* First section - Full screen */
        .landing {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff;
            padding: 20px;
        }

        .landing img {
            width: 600px;
            height: auto;
            border-radius: 10px;
        }

        .content {
            width: 50%;
            padding: 20px;
            text-align: left;
        }

        .content h1 {
            font-size: 50px;
            color: #333;
        }

        .content p {
            font-size: 18px;
            color: #666;
            margin-top: auto;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            width: 100%;
            
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
        label {
    font-family: Arial, sans-serif; 
    font-size: 18px; 
    color: #333; 
    font-weight: bold; 
    display: block; 
    margin-bottom: 5px; 
        }
    </style>
</head>
<body>

    <!-- Landing Section -->
    <div class="landing">
        <img src="static/images/bgregister.jpg" alt="Face Scan">
        <div class="content">
            <h1>Facial Recognition Registration</h1>
            <p>Register your face for quick and easy attendance tracking.</p>
            <form action="/register" method="post">
                <label for="name">Enter Your Full Name:</label>
                <input type="text" id="name" name="name" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

   

</body>
</html>
