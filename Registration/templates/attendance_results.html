<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }
        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h2>📋 Attendance Results</h2>

    <table>
        <tr>
            <th>Student Name</th>
            <th>Status</th>
        </tr>
        {% for name, status in attendance_data %}
        <tr>
            <td>{{ name }}</td>
            <td>{{ status }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
