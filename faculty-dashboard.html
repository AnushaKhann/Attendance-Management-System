<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="faculty-dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img src="/images/sharda-logo.png" alt="Sharda University" class="h-10 w-auto">
          <span class="text-xl font-semibold">Attendance Portal</span>
        </div>
    </header>
    <!-- Hero Section -->
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<!-- Hero Section with Image Slider as Background -->
    <section class="relative h-screen w-full overflow-hidden">
    <!-- Swiper Background -->
        <div class="absolute inset-0 z-0">
            <div class="swiper heroSwiper h-full">
                 <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="/images/campus2.avif" class="w-full h-full object-cover opacity-70" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/images/pic.jpg" class="w-full h-full object-cover opacity-70" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/images/campus3.jpeg" class="w-full h-full object-cover opacity-70" />
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute inset-0 bg-black/50 z-10"></div>
        <div class="relative z-10 h-full flex flex-col justify-center items-center text-black text-center px-6 backdrop-brightness-75">
            <div class="container">
                <h1 class="text-4xl md:text-5xl font-bold mb-6 drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)] text-black bg-black/50 px-6 py-4 rounded-2xl">Faculty Dashboard</h1>
        
                <label for="choose-class">Choose Class:</label>
                <select id="choose-class">
                <option value="">Select a class</option>
                </select>
        
                <label for="new-class">Add Class:</label>
                <input type="text" id="new-class" placeholder="Enter new class name">
                <button id="add-class-btn">Add Class</button>

                <label for="choose-subject">Choose Subject:</label>
                <select id="choose-subject">
                    <option value="">Select a subject</option>
                    <option value="Math">Math</option>
                    <option value="Science">Science</option>
                    <option value="English">English</option>
                    <!-- Add more subjects as needed -->
            </select>

            <div class="attendance-type-selection">
                <label for="attendance-type">Choose Attendance Type:</label>
                <select id="attendance-type">
                    <option value="" selected disabled>Select an option</option>
                    <option value="manual">Manual Attendance</option>
                    <option value="facial">Facial Recognition Attendance</option>
                    <option value="qr">Generate QR</option>
                </select>
            </div>      

            <label for="password">Re-enter Password:</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button id="open-attendance-btn" class="disabled" disabled>Open Attendance Sheet</button>
        
            <div id="message" class="message"></div>
        </div>
    </div>
    </section>

     <!-- Font Awesome CDN for icons -->
     <link
     rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
     />
     
     <!-- Footer Section -->
     <footer class="bg-gray-900 text-white py-12">
     <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-8">
     
       <!-- College Info -->
       <div>
         <h4 class="text-lg font-semibold mb-4">Sharda University</h4>
         <p class="text-gray-400 text-sm">Plot No. 32-34, Knowledge Park III,<br> Greater Noida, Uttar Pradesh – 201306</p>
       </div>
     
       <!-- Contact Info -->
       <div>
         <h4 class="text-lg font-semibold mb-4">Contact Us</h4>
         <p class="text-gray-400 text-sm mb-1"><i class="fas fa-phone mr-2"></i> +91 120 4570000</p>
         <p class="text-gray-400 text-sm"><i class="fas fa-envelope mr-2"></i> info@sharda.ac.in</p>
       </div>
     
       <!-- Social Media -->
       <div>
         <h4 class="text-lg font-semibold mb-4">Follow Us</h4>
         <div class="flex gap-4 text-xl">
           <a href="https://www.facebook.com/ShardaUniversity/" target="_blank" class="hover:text-blue-400 transition">
             <i class="fab fa-facebook-f"></i>
           </a>
           <a href="https://twitter.com/shardauniv" target="_blank" class="hover:text-blue-300 transition">
             <i class="fab fa-twitter"></i>
           </a>
           <a href="https://www.instagram.com/sharda_university/" target="_blank" class="hover:text-pink-400 transition">
             <i class="fab fa-instagram"></i>
           </a>
           <a href="https://www.linkedin.com/school/sharda-university/" target="_blank" class="hover:text-blue-600 transition">
             <i class="fab fa-linkedin-in"></i>
           </a>
         </div>
       </div>
     
     </div>
     
     <!-- Bottom Footer -->
     <div class="text-center text-gray-500 text-sm mt-10">
       &copy; 2025 Sharda University | All rights reserved.
     </div>
     </footer>

    <script src="faculty-dashboard.js"></script>
</body>
</html>
